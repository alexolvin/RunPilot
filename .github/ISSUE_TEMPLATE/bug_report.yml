name: Bug report
description: Something not working as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please describe the problem and how to
        reproduce it.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: RunPilot version or commit (run `runpilot --version`).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs or error output.
      render: shell
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - coordinator
        - gateway
        - node
        - web UI
        - other
